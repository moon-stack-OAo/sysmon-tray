name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve version and changelog notes
        id: notes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pkg = Get-Content -Raw -LiteralPath "package.json" | ConvertFrom-Json
          $version = [string]$pkg.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "package.json 缺少 version"
          }

          $tauri = Get-Content -Raw -LiteralPath "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $tauriVersion = [string]$tauri.version
          if ($tauriVersion -ne $version) {
            throw "版本不一致：package.json=$version, tauri.conf.json=$tauriVersion"
          }

          $cargoText = Get-Content -Raw -LiteralPath "src-tauri/Cargo.toml"
          $cargoMatch = [regex]::Match($cargoText, '(?ms)^\[package\]\s.*?^\s*version\s*=\s*"([^"]+)"')
          if (-not $cargoMatch.Success) {
            throw "无法从 src-tauri/Cargo.toml 的 [package] 读取 version"
          }
          $cargoVersion = $cargoMatch.Groups[1].Value
          if ($cargoVersion -ne $version) {
            throw "版本不一致：package.json=$version, Cargo.toml=$cargoVersion"
          }

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = [string]$env:GITHUB_REF_NAME
            if ($tag -ne "v$version") {
              throw "tag $tag 与版本 v$version 不一致"
            }
          }

          $changelog = Get-Content -Raw -LiteralPath "CHANGELOG.md"
          $escaped = [regex]::Escape($version)
          # 截到下一版本标题，或 Keep a Changelog 底部链接引用区
          $pattern = "(?ms)^## \[$escaped\]\s*\r?\n(.*?)(?=^## \[|^\[|\z)"
          $match = [regex]::Match($changelog, $pattern)

          $builder = New-Object System.Text.StringBuilder
          [void]$builder.AppendLine("## 下载")
          [void]$builder.AppendLine("")
          [void]$builder.AppendLine("- Windows 安装包（NSIS）：``sysmon-tray-setup.exe``")
          [void]$builder.AppendLine("- 便携版：``sysmon-tray-portable.exe``")
          [void]$builder.AppendLine("")

          if ($match.Success) {
            $section = $match.Groups[1].Value.Trim()
            [void]$builder.AppendLine("## 变更说明")
            [void]$builder.AppendLine("")
            [void]$builder.AppendLine($section)
          } else {
            Write-Warning "CHANGELOG.md 未找到 ## [$version] 段落，Release 将仅附下载说明"
            [void]$builder.AppendLine("## 变更说明")
            [void]$builder.AppendLine("")
            [void]$builder.AppendLine("未在 ``CHANGELOG.md`` 中找到 ``## [$version]`` 段落，请查看仓库根目录 ``CHANGELOG.md``。")
          }

          [void]$builder.AppendLine("")
          [void]$builder.AppendLine("完整记录见仓库根目录 ``CHANGELOG.md``。")

          $body = $builder.ToString().TrimEnd() + "`n"

          # GitHub Actions multiline output
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 -NoNewline
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Release version: $version"
          Write-Host "----- release body preview -----"
          Write-Host $body

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 系统监测 v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: '[mainBinaryName]-setup.[ext]'
          uploadPlainBinary: false

      - name: Rename and upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.notes.outputs.version }}"
          $tag = "v$version"
          $portable = "src-tauri/target/release/sysmon-tray.exe"
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not (Test-Path -LiteralPath $portable)) { throw "缺少便携版 exe" }
          if (-not $setup) { throw "缺少 NSIS 安装包" }
          Copy-Item -LiteralPath $portable -Destination "sysmon-tray-portable.exe" -Force
          Copy-Item -LiteralPath $setup.FullName -Destination "sysmon-tray-setup.exe" -Force
          gh release upload $tag "sysmon-tray-setup.exe" "sysmon-tray-portable.exe" --clobber

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sysmon-tray-windows
          path: |
            sysmon-tray-portable.exe
            sysmon-tray-setup.exe
          if-no-files-found: error
